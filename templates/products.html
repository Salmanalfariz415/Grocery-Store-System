<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../static/js/script.js" defer></script>
  <link rel="stylesheet" href="../static/style.css">
</head>

<body class="bg-gray-40 grid ">

<!-- semi-transparent overlay -->
<div id="overlay"></div>

<!-- the panel that appears when adding a new product -->
<div id="hidden_panel" class="p-4 ">
  <h1 class="text-xl text-gray-600 mb-2">Add New Product</h1>
  <hr class="my-4 border-gray-300 ">
  <h3 class="text-gray-700 mb-2">Name</h3>
  <input id="product_name" type="text" class="w-full border border-gray-300 p-2 mb-4">
  <h3 class="text-gray-700 mb-2">Unit of Measurement (UoM)</h3>
<select id="uom" name="uom" placeholder="nf"
  class="border border-gray-300 px-3 py-2 mb-6 w-full">
  <option value="kg">kg</option>
  <option value="each">each</option>
</select>
  <h3 class="text-gray-700 mb-2 ">Price per Unit</h3>
  <input id="product_price" type="number" class="w-full border border-gray-300 p-2 mb-4">
  <hr class="my-4 border-gray-300 gap-4">
  <div class="flex gap-4 justify-end">
    <button id="closeBtn" class="w-24 h-8
                            border border-gray-500 flex 
                            justify-center items-center shadow-lg
                            font-sans bg-gray-300 text-black">Cancel</button>
    <button id="submitBtn" class="w-24 h-8
                            border border-gray-500 flex 
                            justify-center items-center shadow-lg
                            font-sans bg-blue-600 text-white">Add</button>
  </div>
</div>

  <div class="grid grid-cols-4">

    <div class="col-span-1 "></div>

    <div class="col-span-2 relative bg-white max-w-4xl mx-auto p-4 mt-20 
                border-2 border-gray-100 shadow-lg"> 


          <h1 class="text-xl text-gray-600 mb-2 ">Manage Products</h1>
          <hr class="my-4 border-gray-300 ">

          <div class="flex justify-end grid grid-cols-2 grid-rows-1">
            <!-- to make the button right-aligned -->
            <div ></div>
            <div class="flex justify-end">
              <button id="Add_Product" class="row-span-1 col-span-1 w-[9rem] h-8
                                    border border-gray-600 flex 
                                    justify-center items-center shadow-lg
                                    font-sans bg-blue-600 text-white  ">Add New Product</button>
            </div>
          </div>
        <!-- the "table-fixed" makes sure that rows have fixed width -->
            <table class="w-full border table-fixed mt-4">

              <thead>
                <th class="border border-gray-200">Name</th>
                <th class="border border-gray-200 min-w-24">Unit</th>
                <th class="border border-gray-200 ">Price per Unit</th> 
                <th class="border border-gray-200">Action</th>
              </thead>

              <tbody id="tableBody">
               
              </tbody>
            </table>
    </div>
    
<!-- col-span is not given...but still will get 3rd column -->
    <!-- <div class="fixed top-56 right-32 flex flex-col gap-20">
    
    <button id="Save_Products" class="right-5 w-[9rem] min-h-8
                                    border border-gray-500 flex 
                                    justify-center items-center shadow-lg
                                    font-sans bg-green-600 text-white relative">Submit Products</button>

    </div> -->
    
    </div>

</body>
</html>
